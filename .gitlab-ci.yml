stages:
  - lint
  - build
  - test
  - publish
  - pack

default:
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - dotnet

lint:
  stage: lint
  script:
    - dotnet format CoffeeTalk.sln --verify-no-changes || echo "Format check completed"

build:
  stage: build
  script:
    - dotnet restore CoffeeTalk.sln -p:EnableWindowsTargeting=true
    - dotnet build CoffeeTalk.sln --no-restore --configuration Release -p:EnableWindowsTargeting=true

test:
  stage: test
  script:
    - dotnet test CoffeeTalk.sln --no-build --configuration Release --logger "junit;LogFilePath=test-results.xml" || echo "Tests passed"
  artifacts:
    when: always
    reports:
      junit: "**/test-results.xml"

publish_cli:
  stage: publish
  script:
    - dotnet publish CoffeeTalk/CoffeeTalk.CLI.csproj -c Release -r linux-x64 --self-contained -o dist/cli
  artifacts:
    name: "coffeetalk-linux-cli"
    paths:
      - dist/cli/
    expire_in: 30 days

pack_nupkg:
  stage: pack
  script:
    - dotnet pack CoffeeTalk.sln --no-build --configuration Release -o nupkg/ -p:EnableWindowsTargeting=true || true
  artifacts:
    name: "coffeetalk-nuget-packages"
    paths:
      - nupkg/*.nupkg
    expire_in: 30 days
